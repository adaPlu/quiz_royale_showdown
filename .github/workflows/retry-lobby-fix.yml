name: Correct lobby fix migration

on:
  push:
    branches:
      - agent/fix-host-start-solo
    paths:
      - .github/workflows/retry-lobby-fix.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-host-start-solo
          fetch-depth: 0
      - name: Correct store replacement and retrigger
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-lobby-fix.yml')
          text = path.read_text()
          old = """              '''      roomId: room.roomId,\\n      code: room.code,\\n      phase:''',
              '''      roomId: room.roomId,\\n      code: room.code,\\n      hostUserId: room.hostUserId,\\n      phase:''',"""
          new = """              '''      roomId: payload.room.roomId,\\n      code: payload.room.code,\\n      phase:''',
              '''      roomId: payload.room.roomId,\\n      code: payload.room.code,\\n      hostUserId: payload.room.hostUserId,\\n      phase:''',"""
          if old not in text:
              raise RuntimeError('gameStore workflow replacement not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/retry-lobby-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: correct game store migration"
          git push origin HEAD:agent/fix-host-start-solo
