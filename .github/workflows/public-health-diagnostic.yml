name: Public Railway health diagnostic

on:
  push:
    branches:
      - diagnostic/railway-failed-deployment-logs

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check liveness
        run: curl --fail-with-body --silent --show-error --max-time 20 https://quizroyaleshowdown-production.up.railway.app/health

      - name: Check readiness
        if: always()
        run: curl --fail-with-body --silent --show-error --max-time 20 https://quizroyaleshowdown-production.up.railway.app/health/ready
