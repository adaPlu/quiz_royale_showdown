name: Apply host and game start fix

on:
  push:
    branches:
      - agent/fix-host-start-solo
    paths:
      - .github/workflows/apply-lobby-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-host-start-solo
          fetch-depth: 0

      - name: Apply lobby and startup fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected 1 match, found {count} for {old[:80]!r}")
              file_path.write_text(text.replace(old, new, 1))

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              start_index = text.find(start)
              if start_index < 0:
                  raise RuntimeError(f"{path}: start marker not found")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise RuntimeError(f"{path}: end marker not found")
              file_path.write_text(text[:start_index] + replacement + text[end_index:])

          # Backend room snapshots now identify the host everywhere.
          replace_once(
              "backend/src/types/contracts.ts",
              '''  roomId: string;\n  code: string;\n  phase:''',
              '''  roomId: string;\n  code: string;\n  hostUserId: string;\n  phase:''',
          )
          replace_once(
              "backend/src/socket/handlers/playerReady.ts",
              '''    roomId: room.id,\n    code: room.code,\n    phase:''',
              '''    roomId: room.id,\n    code: room.code,\n    hostUserId: room.hostUserId,\n    phase:''',
          )
          replace_once(
              "backend/src/services/RoomService.ts",
              '''        roomId: room.id,\n        code: room.code,\n        phase:''',
              '''        roomId: room.id,\n        code: room.code,\n        hostUserId: room.hostUserId,\n        phase:''',
          )

          # Recover lobby state for every client after a failed game start.
          replace_once(
              "backend/src/services/GameOrchestrator.ts",
              '''      emitRoomEnvelope(io, roomId, {\n        type: "error",''',
              '''      const recoveredRoom = await roomService.getRoomById(roomId).catch(() => null);\n      if (recoveredRoom) {\n        emitRoomEnvelope(io, roomId, {\n          type: "room:state_sync",\n          version: "v1",\n          payload: { room: recoveredRoom.room }\n        });\n      }\n\n      emitRoomEnvelope(io, roomId, {\n        type: "error",''',
          )
          replace_once(
              "backend/src/socket/registerHandlers.ts",
              '''    io.to(roomId).emit("message", {\n      type: "error",''',
              '''    const recoveredRoom = await roomService.getRoomById(roomId).catch(() => null);\n    if (recoveredRoom) {\n      io.to(roomId).emit("message", {\n        type: "room:state_sync",\n        version: "v1",\n        payload: { room: recoveredRoom.room }\n      } satisfies ServerEvents);\n    }\n\n    io.to(roomId).emit("message", {\n      type: "error",''',
          )

          # Ensure Railway always has an active built-in question bank.
          replace_once(
              "backend/start.sh",
              '''fi\n\necho "Starting server..."''',
              '''fi\n\nSEED_TIMEOUT_SECONDS="${SEED_TIMEOUT_SECONDS:-60}"\necho "Ensuring the production question bank is ready..."\nif timeout "$SEED_TIMEOUT_SECONDS" node dist/scripts/seed.js; then\n  echo "Question bank is ready."\nelse\n  seed_status=$?\n  echo "WARNING: Database seed check failed with exit code ${seed_status}."\n  echo "The server will start, but game starts may fail until active questions exist."\nfi\n\necho "Starting server..."''',
          )
          replace_once(
              "backend/src/scripts/seed.ts",
              '''  const count = await prisma.questionBank.count();''',
              '''  const count = await prisma.questionBank.count({ where: { isActive: true } });''',
          )
          replace_once(
              "backend/src/scripts/seed.ts",
              '''    if (!existing) {\n      await prisma.questionBank.create({\n        data: { id: ulid(), ...q, isActive: true }\n      });\n    }''',
              '''    if (!existing) {\n      await prisma.questionBank.create({\n        data: { id: ulid(), ...q, isActive: true }\n      });\n    } else if (!existing.isActive) {\n      await prisma.questionBank.update({\n        where: { id: existing.id },\n        data: { isActive: true }\n      });\n    }''',
          )

          # Web contract/store host identity.
          replace_once(
              "webapp/src/lib/contracts.ts",
              '''  roomId: z.string(),\n  code: z.string(),\n  phase:''',
              '''  roomId: z.string(),\n  code: z.string(),\n  hostUserId: z.string(),\n  phase:''',
          )
          replace_once(
              "webapp/src/stores/gameStore.ts",
              '''  roomId: string | null;\n  code: string | null;\n  phase:''',
              '''  roomId: string | null;\n  code: string | null;\n  hostUserId: string | null;\n  phase:''',
          )
          replace_once(
              "webapp/src/stores/gameStore.ts",
              '''  roomId: null,\n  code: null,\n  phase:''',
              '''  roomId: null,\n  code: null,\n  hostUserId: null,\n  phase:''',
          )
          replace_once(
              "webapp/src/stores/gameStore.ts",
              '''      roomId: room.roomId,\n      code: room.code,\n      phase:''',
              '''      roomId: room.roomId,\n      code: room.code,\n      hostUserId: room.hostUserId,\n      phase:''',
          )

          # Web lobby: host badge, host-only controls, explicit solo/multiplayer modes.
          replace_once(
              "webapp/src/pages/LobbyPage.tsx",
              '''  const accessToken = useAuthStore((state) => state.accessToken);''',
              '''  const accessToken = useAuthStore((state) => state.accessToken);\n  const userId = useAuthStore((state) => state.user?.id ?? null);''',
          )
          replace_once(
              "webapp/src/pages/LobbyPage.tsx",
              '''  const code = useGameStore((state) => state.code);\n  const phase = useGameStore((state) => state.phase);''',
              '''  const code = useGameStore((state) => state.code);\n  const hostUserId = useGameStore((state) => state.hostUserId);\n  const phase = useGameStore((state) => state.phase);''',
          )
          replace_once(
              "webapp/src/pages/LobbyPage.tsx",
              '''  const hasMultiplePlayers = players.length >= 2;\n  const resetRoom = useGameStore((state) => state.resetRoom);''',
              '''  const hasMultiplePlayers = players.length >= 2;\n  const isHost = Boolean(userId && hostUserId === userId);\n  const hostPlayer = players.find((player) => player.id === hostUserId);\n  const hostName = hostPlayer?.displayName ?? 'the room host';\n  const resetRoom = useGameStore((state) => state.resetRoom);''',
          )
          replace_once(
              "webapp/src/pages/LobbyPage.tsx",
              '''    if (!roomId) return;''',
              '''    if (!roomId || !isHost) return;''',
          )
          replace_once(
              "webapp/src/pages/LobbyPage.tsx",
              '''      // allowSolo makes this a true manual override: the host may start with\n      // one player, two players, or any larger room size.\n      await api.post(`/rooms/${roomId}/start`, { allowSolo: true });''',
              '''      await api.post(`/rooms/${roomId}/start`, { allowSolo: !hasMultiplePlayers });''',
          )
          replace_once(
              "webapp/src/pages/LobbyPage.tsx",
              '''  }, [hasMultiplePlayers, mountedRef, roomId]);''',
              '''  }, [hasMultiplePlayers, isHost, mountedRef, roomId]);''',
          )
          replace_once(
              "webapp/src/pages/LobbyPage.tsx",
              '''            {players.map((player) => (\n              <PlayerAvatar key={player.id} player={player} />\n            ))}''',
              '''            {players.map((player) => (\n              <div key={player.id} className="relative">\n                {player.id === hostUserId && (\n                  <span className="absolute right-3 top-3 z-10 rounded-full bg-brand-gold px-3 py-1 text-[10px] font-black uppercase tracking-widest text-black">\n                    Host\n                  </span>\n                )}\n                <PlayerAvatar player={player} />\n              </div>\n            ))}''',
          )

          lobby_controls = '''          <div className="mt-6 grid gap-4 lg:grid-cols-[1.15fr_0.85fr]">\n            <div className="rounded-3xl border border-white/10 bg-black/20 p-5">\n              <div className="flex items-center justify-between gap-3">\n                <p className="text-sm font-semibold uppercase tracking-[0.2em] text-white/60">\n                  Game Controls\n                </p>\n                <span className="rounded-full border border-brand-gold/40 bg-brand-gold/10 px-3 py-1 text-xs font-bold text-brand-gold">\n                  {isHost ? 'You are Host' : `${hostName} is Host`}\n                </span>\n              </div>\n\n              {isHost ? (\n                phase === 'WAITING' ? (\n                  <>\n                    <p className="mt-4 text-lg font-bold text-white">\n                      {hasMultiplePlayers ? 'Multiplayer Mode' : 'Single Player Mode'}\n                    </p>\n                    <p className="mt-2 text-sm text-white/70">\n                      {hasMultiplePlayers\n                        ? `${players.length} players are connected. Start now without waiting for automatic launch.`\n                        : 'Play all ten trivia rounds by yourself. You can also invite friends before starting.'}\n                    </p>\n                    <button\n                      type="button"\n                      disabled={isStarting}\n                      onClick={() => void handleStartGame()}\n                      className="mt-5 w-full rounded-2xl bg-brand-gold px-4 py-4 text-sm font-black uppercase tracking-widest text-black shadow-royale transition hover:opacity-90 disabled:opacity-40"\n                    >\n                      {isStarting\n                        ? 'Starting...'\n                        : hasMultiplePlayers\n                          ? 'Start Multiplayer'\n                          : 'Play Solo'}\n                    </button>\n                  </>\n                ) : (\n                  <p className="mt-4 text-sm text-white/70">\n                    {phaseCopy[phase] ?? phase}. Game controls will return if startup fails.\n                  </p>\n                )\n              ) : (\n                <>\n                  <p className="mt-4 text-lg font-bold text-white">Waiting for the host</p>\n                  <p className="mt-2 text-sm text-white/70">\n                    {hostName} can start the game. Host-only controls are hidden from other players.\n                  </p>\n                </>\n              )}\n\n              {startNotice && <p className="mt-3 text-sm text-brand-gold">{startNotice}</p>}\n              {startError && <p className="mt-3 text-sm text-answer-wrong">{startError}</p>}\n            </div>\n\n            <div className="rounded-3xl border border-white/10 bg-black/20 p-5">\n              <p className="text-sm font-semibold uppercase tracking-[0.2em] text-white/60">\n                Invite Players\n              </p>\n              <p className="mt-3 text-sm text-white/70">\n                Share code <span className="font-mono font-bold text-white">{displayCode}</span> or send a link that loads this room code.\n              </p>\n\n              <div className="mt-5 grid gap-3 sm:grid-cols-2">\n                <button\n                  type="button"\n                  disabled={!canRecoverSession}\n                  onClick={() => void copyInvite()}\n                  className="rounded-2xl border border-white/10 px-4 py-3 text-sm font-semibold text-white transition hover:border-white/30 disabled:opacity-40"\n                >\n                  Copy Invite\n                </button>\n                <button\n                  type="button"\n                  disabled={!canRecoverSession}\n                  onClick={() => void copyInvite('Friends invite')}\n                  className="rounded-2xl border border-white/10 px-4 py-3 text-sm font-semibold text-white transition hover:border-white/30 disabled:opacity-40"\n                >\n                  Copy for Friends\n                </button>\n              </div>\n\n              <div className="mt-3 flex flex-col gap-2 sm:flex-row">\n                <input\n                  value={email}\n                  onChange={(event) => setEmail(event.target.value)}\n                  type="email"\n                  placeholder="friend@email.com"\n                  className="min-w-0 flex-1 rounded-2xl border border-white/10 bg-black/25 px-4 py-3 text-sm text-white placeholder-white/35 outline-none transition focus:border-brand"\n                />\n                <button\n                  type="button"\n                  disabled={!canRecoverSession}\n                  onClick={emailInvite}\n                  className="rounded-2xl bg-white px-4 py-3 text-sm font-bold text-black transition hover:opacity-90 disabled:opacity-40"\n                >\n                  Email Invite\n                </button>\n              </div>\n\n              {inviteNotice && <p className="mt-3 text-sm text-brand-gold">{inviteNotice}</p>}\n              {inviteError && <p className="mt-3 text-sm text-answer-wrong">{inviteError}</p>}\n            </div>\n          </div>\n'''
          replace_between(
              "webapp/src/pages/LobbyPage.tsx",
              "          {phase === 'WAITING' && (\n",
              "        </section>",
              lobby_controls,
          )

          # List Single Player explicitly on the home screen.
          replace_once(
              "webapp/src/pages/HomePage.tsx",
              '''  const createRoom = async (isPrivate: boolean) => {\n    setLoading(isPrivate ? 'private' : 'create');''',
              '''  const createRoom = async (\n    isPrivate: boolean,\n    action = isPrivate ? 'private' : 'create',\n  ) => {\n    setLoading(action);''',
          )
          replace_once(
              "webapp/src/pages/HomePage.tsx",
              '''        <button\n          onClick={() => createRoom(true)}''',
              '''        <button\n          onClick={() => createRoom(true, 'solo')}\n          disabled={!!loading}\n          className="w-full py-4 rounded-2xl bg-brand-gold text-black font-black text-lg shadow-royale hover:opacity-90 disabled:opacity-60"\n        >\n          {loading === 'solo' ? 'Creating solo game...' : 'Single Player'}\n        </button>\n        <p className="-mt-2 text-center text-xs text-game-muted">\n          Create a private lobby, then tap Play Solo.\n        </p>\n\n        <button\n          onClick={() => createRoom(true)}''',
          )

          # Web lobby regression test now verifies host and solo controls.
          Path("webapp/src/pages/LobbyPage.test.tsx").write_text('''import React from 'react';\nimport { renderToStaticMarkup } from 'react-dom/server';\nimport { beforeEach, describe, expect, it } from 'vitest';\n\nimport { MemoryRouter } from '../navigation';\nimport { LobbyPage } from './LobbyPage';\nimport { useAuthStore } from '@/stores/authStore';\nimport { useGameStore } from '@/stores/gameStore';\n\nfunction renderLobby(playerIds: string[] = ['host-user']) {\n  useAuthStore.setState({\n    user: {\n      id: 'host-user',\n      username: 'Host',\n      displayName: 'Host',\n      email: 'host@example.com',\n      level: 1,\n      xp: 0,\n      coins: 0,\n    },\n    accessToken: 'test-token',\n  });\n  useGameStore.setState({\n    roomId: 'room-1',\n    code: 'ABCD23',\n    hostUserId: 'host-user',\n    phase: 'WAITING',\n    roundNumber: 0,\n    totalRounds: 10,\n    players: playerIds.map((id, index) => ({\n      id,\n      displayName: index === 0 ? 'Host' : `Player ${index + 1}`,\n      score: 0,\n      streak: 0,\n      isEliminated: false,\n    })),\n  });\n\n  return renderToStaticMarkup(\n    <MemoryRouter initialEntries={['/lobby/room-1']}>\n      <LobbyPage />\n    </MemoryRouter>,\n  );\n}\n\ndescribe('LobbyPage', () => {\n  beforeEach(() => {\n    useGameStore.getState().resetRoom();\n    useAuthStore.setState({ user: null, accessToken: null });\n  });\n\n  it('labels the host and exposes an explicit solo mode when alone', () => {\n    const html = renderLobby();\n\n    expect(html).toContain('Host');\n    expect(html).toContain('You are Host');\n    expect(html).toContain('Single Player Mode');\n    expect(html).toContain('Play Solo');\n    expect(html).toContain('Copy Invite');\n  });\n\n  it('shows the multiplayer start action when another player is present', () => {\n    const html = renderLobby(['host-user', 'player-2']);\n\n    expect(html).toContain('Multiplayer Mode');\n    expect(html).toContain('Start Multiplayer');\n  });\n});\n''')

          # Android: identify host and support explicit solo start requests.
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/data/room/RoomModels.kt",
              '''@Serializable\ndata class JoinRoomRequest(\n    val roomCode: String? = null,\n)\n''',
              '''@Serializable\ndata class JoinRoomRequest(\n    val roomCode: String? = null,\n)\n\n@Serializable\ndata class StartGameRequest(\n    val allowSolo: Boolean = false,\n)\n''',
          )
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/data/room/RoomApi.kt",
              '''    @POST("rooms/{roomId}/start")\n    suspend fun startGame(@Path("roomId") roomId: String): JsonObject''',
              '''    @POST("rooms/{roomId}/start")\n    suspend fun startGame(\n        @Path("roomId") roomId: String,\n        @Body request: StartGameRequest,\n    ): JsonObject''',
          )
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/data/room/RoomRepository.kt",
              '''    suspend fun startGame(roomId: String) {\n        roomApi.startGame(roomId)\n    }''',
              '''    suspend fun startGame(roomId: String, allowSolo: Boolean = false) {\n        roomApi.startGame(roomId, StartGameRequest(allowSolo = allowSolo))\n    }''',
          )
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/ui/lobby/LobbyViewModel.kt",
              '''import com.quizroyale.showdown.data.room.CachedRoomSummary''',
              '''import com.quizroyale.showdown.data.auth.AuthRepository\nimport com.quizroyale.showdown.data.room.CachedRoomSummary''',
          )
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/ui/lobby/LobbyViewModel.kt",
              '''data class LobbyUiState(\n    val roomReference: String? = null,''',
              '''data class LobbyUiState(\n    val roomReference: String? = null,\n    val currentUserId: String? = null,''',
          )
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/ui/lobby/LobbyViewModel.kt",
              '''    private val roomRepository: RoomRepository,\n    private val webSocketManager: WebSocketManager,''',
              '''    private val roomRepository: RoomRepository,\n    private val authRepository: AuthRepository,\n    private val webSocketManager: WebSocketManager,''',
          )
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/ui/lobby/LobbyViewModel.kt",
              '''        LobbyUiState(roomReference = requestedRoomReference)''',
              '''        LobbyUiState(\n            roomReference = requestedRoomReference,\n            currentUserId = authRepository.currentUserId(),\n        )''',
          )
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/ui/lobby/LobbyViewModel.kt",
              '''    fun startGame() {\n        val roomId = _uiState.value.room?.roomId ?: return''',
              '''    fun startGame(allowSolo: Boolean) {\n        val roomId = _uiState.value.room?.roomId ?: return''',
          )
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/ui/lobby/LobbyViewModel.kt",
              '''            runCatching { roomRepository.startGame(roomId) }''',
              '''            runCatching { roomRepository.startGame(roomId, allowSolo = allowSolo) }''',
          )
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/ui/lobby/LobbyScreen.kt",
              '''    val roomReference = liveRoom?.roomReference ?: cachedRoom?.roomReference\n''',
              '''    val roomReference = liveRoom?.roomReference ?: cachedRoom?.roomReference\n    val isHost = liveRoom?.hostUserId != null && liveRoom.hostUserId == uiState.currentUserId\n    val hostName = liveRoom?.players\n        ?.firstOrNull { it.id == liveRoom.hostUserId }\n        ?.displayName\n        ?: "the room host"\n''',
          )
          replace_once(
              "android/app/src/main/java/com/quizroyale/showdown/ui/lobby/LobbyScreen.kt",
              '''                                    append(player.score)\n                                    append(" pts")''',
              '''                                    append(player.score)\n                                    append(" pts")\n                                    if (player.id == liveRoom.hostUserId) {\n                                        append(" - Host")\n                                    }''',
          )

          android_controls = '''        liveRoom?.let { room ->\n            ElevatedCard(modifier = Modifier.fillMaxWidth()) {\n                Column(\n                    modifier = Modifier.padding(20.dp),\n                    verticalArrangement = Arrangement.spacedBy(12.dp),\n                ) {\n                    Text("Game Controls", style = MaterialTheme.typography.titleMedium)\n                    Text(\n                        text = if (isHost) "You are the host" else "$hostName is the host",\n                        style = MaterialTheme.typography.bodyMedium,\n                    )\n\n                    if (room.phase == "WAITING" && isHost) {\n                        val isSolo = room.totalPlayers == 1\n                        Text(\n                            text = if (isSolo) "Single Player Mode" else "Multiplayer Mode",\n                            style = MaterialTheme.typography.titleLarge,\n                        )\n                        Button(\n                            onClick = { viewModel.startGame(allowSolo = isSolo) },\n                            enabled = !uiState.isStartingGame,\n                            modifier = Modifier.fillMaxWidth(),\n                        ) {\n                            if (uiState.isStartingGame) {\n                                CircularProgressIndicator(strokeWidth = 2.dp, color = Color.White)\n                            } else {\n                                Text(if (isSolo) "Play Solo" else "Start Multiplayer")\n                            }\n                        }\n                    } else if (!isHost) {\n                        Text(\n                            text = "Waiting for $hostName to start the game.",\n                            style = MaterialTheme.typography.bodySmall,\n                            color = Color.Gray,\n                        )\n                    } else {\n                        Text(\n                            text = "Phase ${room.phase}. The game is starting or already in progress.",\n                            style = MaterialTheme.typography.bodySmall,\n                            color = Color.Gray,\n                        )\n                    }\n                }\n            }\n        }\n\n'''
          replace_between(
              "android/app/src/main/java/com/quizroyale/showdown/ui/lobby/LobbyScreen.kt",
              '''        if (liveRoom?.phase == "WAITING") {\n''',
              '''        Row(\n            modifier = Modifier.fillMaxWidth(),''',
              android_controls,
          )
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/apply-lobby-fix.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: expose host controls and restore game starts"
          git push origin HEAD:agent/fix-host-start-solo
