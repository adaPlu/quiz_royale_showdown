name: Apply host and game start fix v2

on:
  push:
    branches:
      - agent/fix-host-start-solo
    paths:
      - .github/workflows/apply-lobby-fix-v2.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-host-start-solo
          fetch-depth: 0
      - name: Apply code changes
        run: python scripts/apply-host-start-solo-fix.py
      - name: Commit code changes
        run: |
          git rm scripts/apply-host-start-solo-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend android webapp
          git commit -m "fix: expose host controls and restore game starts"
          git push origin HEAD:agent/fix-host-start-solo
