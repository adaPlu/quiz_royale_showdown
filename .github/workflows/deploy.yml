name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  statuses: read
  packages: write

jobs:
  backend-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate backend image
        run: docker build -t "quiz-royale-backend:${DEPLOY_SHA}" ./backend

      - name: Validate production startup and readiness
        shell: bash
        run: bash scripts/validate-backend-runtime.sh "quiz-royale-backend:${DEPLOY_SHA}" "${DEPLOY_SHA}"

  provider-status:
    needs: backend-image
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for native Railway and Vercel deployments
        shell: bash
        run: |
          set -euo pipefail
          STATUS_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}/status"

          for attempt in {1..120}; do
            STATUS_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$STATUS_URL")"

            VERCEL_STATE="$(printf '%s' "$STATUS_JSON" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((item.get("state", "") for item in data.get("statuses", []) if item.get("context") == "Vercel"), ""))')"
            RAILWAY_STATE="$(printf '%s' "$STATUS_JSON" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((item.get("state", "") for item in data.get("statuses", []) if "quiz_royale_showdown" in item.get("context", "")), ""))')"

            echo "Provider attempt ${attempt}: Vercel=${VERCEL_STATE:-pending} Railway=${RAILWAY_STATE:-pending}"

            if [ "$VERCEL_STATE" = "failure" ] || [ "$VERCEL_STATE" = "error" ] \
              || [ "$RAILWAY_STATE" = "failure" ] || [ "$RAILWAY_STATE" = "error" ]; then
              echo "A native provider deployment failed."
              exit 1
            fi

            if [ "$VERCEL_STATE" = "success" ] && [ "$RAILWAY_STATE" = "success" ]; then
              echo "Native Railway and Vercel deployments completed successfully."
              exit 0
            fi

            sleep 5
          done

          echo "Native provider deployments did not complete within 10 minutes."
          exit 1

  release-gate:
    needs: provider-status
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://quiz-royale-showdown.vercel.app' }}
      BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL || 'https://quizroyaleshowdown-production.up.railway.app' }}
    steps:
      - name: Verify live readiness and release SHA synchronization
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_URL="${FRONTEND_URL%/}"
          BACKEND_URL="${BACKEND_URL%/}"

          for attempt in {1..60}; do
            BACKEND_JSON="$(curl --fail --silent --show-error --max-time 10 "${BACKEND_URL}/health/ready" || true)"
            FRONTEND_HTML="$(curl --fail --silent --show-error --max-time 10 "${FRONTEND_URL}/" || true)"

            BACKEND_READY="$(printf '%s' "$BACKEND_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' 2>/dev/null || true)"
            BACKEND_SHA="$(printf '%s' "$BACKEND_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("buildSha", ""))' 2>/dev/null || true)"
            FRONTEND_SHA="$(printf '%s' "$FRONTEND_HTML" | python3 -c 'import re,sys; html=sys.stdin.read(); match=re.search(r"<meta\s+name=[\"\x27]quiz-build-sha[\"\x27]\s+content=[\"\x27]([^\"\x27]+)", html, re.I); print(match.group(1) if match else "")' 2>/dev/null || true)"

            echo "Release attempt ${attempt}: ready=${BACKEND_READY:-missing} frontend=${FRONTEND_SHA:-missing} backend=${BACKEND_SHA:-missing} expected=${DEPLOY_SHA}"

            if [ "$BACKEND_READY" = "ok" ] \
              && [ "$FRONTEND_SHA" = "$DEPLOY_SHA" ] \
              && [ "$BACKEND_SHA" = "$DEPLOY_SHA" ]; then
              echo "Frontend and ready backend are live on the same release SHA."
              exit 0
            fi

            sleep 5
          done

          echo "Live services did not become ready on ${DEPLOY_SHA}."
          exit 1
