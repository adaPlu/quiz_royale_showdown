name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  statuses: read
  packages: write

jobs:
  backend-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate backend image
        run: docker build -t "quiz-royale-backend:${DEPLOY_SHA}" ./backend

      - name: Validate production startup and readiness
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="quiz-royale-backend:${DEPLOY_SHA}"
          NETWORK="quiz-runtime-${{ github.run_id }}"

          cleanup() {
            docker logs quiz-backend 2>/dev/null || true
            docker rm -f quiz-backend quiz-postgres quiz-redis 2>/dev/null || true
            docker network rm "$NETWORK" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker network create "$NETWORK"
          docker run -d --name quiz-postgres --network "$NETWORK" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=test-password \
            -e POSTGRES_DB=quiz_royale \
            postgres:16-alpine
          docker run -d --name quiz-redis --network "$NETWORK" redis:7-alpine

          for attempt in {1..30}; do
            if docker exec quiz-postgres pg_isready -U postgres -d quiz_royale >/dev/null 2>&1 \
              && docker exec quiz-redis redis-cli ping | grep -q PONG; then
              break
            fi
            sleep 2
          done

          docker run -d --name quiz-backend --network "$NETWORK" -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e LOG_LEVEL=info \
            -e CORS_ORIGIN=https://quiz-royale-showdown.vercel.app \
            -e DATABASE_URL=postgresql://postgres:test-password@quiz-postgres:5432/quiz_royale \
            -e REDIS_URL=redis://quiz-redis:6379 \
            -e JWT_ACCESS_SECRET=ci-access-secret-that-is-at-least-32-characters \
            -e JWT_REFRESH_SECRET=ci-refresh-secret-that-is-at-least-32-characters \
            -e ADMIN_SECRET=ci-admin-secret-that-is-at-least-32-characters \
            -e BUILD_SHA="${DEPLOY_SHA}" \
            "$IMAGE"

          for attempt in {1..75}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/health/ready; then
              echo
              echo "Backend production readiness check passed."
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' quiz-backend | grep -q true; then
              echo "Backend container exited before becoming ready."
              exit 1
            fi
            sleep 2
          done

          echo "Backend did not become ready within 150 seconds."
          exit 1

  provider-status:
    needs: backend-image
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for native Railway and Vercel deployments
        shell: bash
        run: |
          set -euo pipefail
          STATUS_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}/status"

          for attempt in {1..120}; do
            STATUS_JSON="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$STATUS_URL")"

            VERCEL_STATE="$(printf '%s' "$STATUS_JSON" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((item.get("state", "") for item in data.get("statuses", []) if item.get("context") == "Vercel"), ""))')"
            RAILWAY_STATE="$(printf '%s' "$STATUS_JSON" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((item.get("state", "") for item in data.get("statuses", []) if "quiz_royale_showdown" in item.get("context", "")), ""))')"

            echo "Provider attempt ${attempt}: Vercel=${VERCEL_STATE:-pending} Railway=${RAILWAY_STATE:-pending}"

            if [ "$VERCEL_STATE" = "failure" ] || [ "$VERCEL_STATE" = "error" ] \
              || [ "$RAILWAY_STATE" = "failure" ] || [ "$RAILWAY_STATE" = "error" ]; then
              echo "A native provider deployment failed."
              exit 1
            fi

            if [ "$VERCEL_STATE" = "success" ] && [ "$RAILWAY_STATE" = "success" ]; then
              echo "Native Railway and Vercel deployments completed successfully."
              exit 0
            fi

            sleep 5
          done

          echo "Native provider deployments did not complete within 10 minutes."
          exit 1

  release-gate:
    needs: provider-status
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://quiz-royale-showdown.vercel.app' }}
      BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL || 'https://quizroyaleshowdown-production.up.railway.app' }}
    steps:
      - name: Verify live frontend and backend SHA synchronization
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_URL="${FRONTEND_URL%/}"
          BACKEND_URL="${BACKEND_URL%/}"

          for attempt in {1..60}; do
            BACKEND_JSON="$(curl --fail --silent --show-error --max-time 10 "${BACKEND_URL}/health" || true)"
            FRONTEND_HTML="$(curl --fail --silent --show-error --max-time 10 "${FRONTEND_URL}/" || true)"

            BACKEND_SHA="$(printf '%s' "$BACKEND_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("buildSha", ""))' 2>/dev/null || true)"
            FRONTEND_SHA="$(printf '%s' "$FRONTEND_HTML" | python3 -c 'import re,sys; html=sys.stdin.read(); match=re.search(r"<meta\s+name=[\"\x27]quiz-build-sha[\"\x27]\s+content=[\"\x27]([^\"\x27]+)", html, re.I); print(match.group(1) if match else "")' 2>/dev/null || true)"

            echo "Synchronization attempt ${attempt}: frontend=${FRONTEND_SHA:-missing} backend=${BACKEND_SHA:-missing} expected=${DEPLOY_SHA}"

            if [ "$FRONTEND_SHA" = "$DEPLOY_SHA" ] && [ "$BACKEND_SHA" = "$DEPLOY_SHA" ]; then
              echo "Frontend and backend are live on the same release SHA."
              exit 0
            fi

            sleep 5
          done

          echo "Live services did not converge on ${DEPLOY_SHA}."
          exit 1
