name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  backend-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate backend image
        run: docker build -t "quiz-royale-backend:${DEPLOY_SHA}" ./backend

      - name: Validate production startup and readiness
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="quiz-royale-backend:${DEPLOY_SHA}"
          NETWORK="quiz-runtime-${{ github.run_id }}"

          cleanup() {
            docker logs quiz-backend 2>/dev/null || true
            docker rm -f quiz-backend quiz-postgres quiz-redis 2>/dev/null || true
            docker network rm "$NETWORK" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker network create "$NETWORK"
          docker run -d --name quiz-postgres --network "$NETWORK" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=test-password \
            -e POSTGRES_DB=quiz_royale \
            postgres:16-alpine
          docker run -d --name quiz-redis --network "$NETWORK" redis:7-alpine

          for attempt in {1..30}; do
            if docker exec quiz-postgres pg_isready -U postgres -d quiz_royale >/dev/null 2>&1 \
              && docker exec quiz-redis redis-cli ping | grep -q PONG; then
              break
            fi
            sleep 2
          done

          docker run -d --name quiz-backend --network "$NETWORK" -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e LOG_LEVEL=info \
            -e CORS_ORIGIN=https://quiz-royale-showdown.vercel.app \
            -e DATABASE_URL=postgresql://postgres:test-password@quiz-postgres:5432/quiz_royale \
            -e REDIS_URL=redis://quiz-redis:6379 \
            -e JWT_ACCESS_SECRET=ci-access-secret-that-is-at-least-32-characters \
            -e JWT_REFRESH_SECRET=ci-refresh-secret-that-is-at-least-32-characters \
            -e ADMIN_SECRET=ci-admin-secret-that-is-at-least-32-characters \
            "$IMAGE"

          for attempt in {1..75}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/health/ready; then
              echo
              echo "Backend production readiness check passed."
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' quiz-backend | grep -q true; then
              echo "Backend container exited before becoming ready."
              exit 1
            fi
            sleep 2
          done

          echo "Backend did not become ready within 150 seconds."
          exit 1

  deploy:
    needs: backend-image
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      HAS_VERCEL_CONFIG: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
      PUBLISH_GHCR_IMAGE: ${{ vars.PUBLISH_GHCR_IMAGE == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare image name
        if: env.PUBLISH_GHCR_IMAGE == 'true'
        run: echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY}/quiz-royale-backend | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build backend image for publishing
        if: env.PUBLISH_GHCR_IMAGE == 'true'
        run: docker build -t "${IMAGE_NAME}:${DEPLOY_SHA}" ./backend

      - name: Login to GHCR
        if: env.PUBLISH_GHCR_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        if: env.PUBLISH_GHCR_IMAGE == 'true'
        run: |
          docker push "${IMAGE_NAME}:${DEPLOY_SHA}"
          docker tag "${IMAGE_NAME}:${DEPLOY_SHA}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"

      - name: Verify Vercel deploy secrets
        if: env.HAS_VERCEL_TOKEN == 'true' && env.HAS_VERCEL_CONFIG != 'true'
        run: |
          echo "VERCEL_TOKEN is set, but VERCEL_ORG_ID or VERCEL_PROJECT_ID is missing."
          exit 1

      - name: Pull Vercel project config
        if: env.HAS_VERCEL_CONFIG == 'true'
        run: npm exec --yes --package vercel@58.4.4 -- vercel pull --yes --environment=production --scope adaplus-projects --token "${{ secrets.VERCEL_TOKEN }}"
        working-directory: webapp
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel output
        if: env.HAS_VERCEL_CONFIG == 'true'
        run: npm exec --yes --package vercel@58.4.4 -- vercel build --prod --scope adaplus-projects --token "${{ secrets.VERCEL_TOKEN }}"
        working-directory: webapp
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Vercel output
        if: env.HAS_VERCEL_CONFIG == 'true'
        run: npm exec --yes --package vercel@58.4.4 -- vercel deploy --prebuilt --prod --scope adaplus-projects --token "${{ secrets.VERCEL_TOKEN }}"
        working-directory: webapp
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Trigger Railway deploy
        if: env.HAS_RAILWAY_TOKEN == 'true'
        run: npm exec --yes --package @railway/cli@5.24.0 -- railway up --service backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
