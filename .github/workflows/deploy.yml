name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  backend-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate backend image
        run: docker build -t "quiz-royale-backend:${DEPLOY_SHA}" ./backend

      - name: Validate production startup and readiness
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="quiz-royale-backend:${DEPLOY_SHA}"
          NETWORK="quiz-runtime-${{ github.run_id }}"

          cleanup() {
            docker logs quiz-backend 2>/dev/null || true
            docker rm -f quiz-backend quiz-postgres quiz-redis 2>/dev/null || true
            docker network rm "$NETWORK" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker network create "$NETWORK"
          docker run -d --name quiz-postgres --network "$NETWORK" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=test-password \
            -e POSTGRES_DB=quiz_royale \
            postgres:16-alpine
          docker run -d --name quiz-redis --network "$NETWORK" redis:7-alpine

          for attempt in {1..30}; do
            if docker exec quiz-postgres pg_isready -U postgres -d quiz_royale >/dev/null 2>&1 \
              && docker exec quiz-redis redis-cli ping | grep -q PONG; then
              break
            fi
            sleep 2
          done

          docker run -d --name quiz-backend --network "$NETWORK" -p 4000:4000 \
            -e NODE_ENV=production \
            -e PORT=4000 \
            -e LOG_LEVEL=info \
            -e CORS_ORIGIN=https://quiz-royale-showdown.vercel.app \
            -e DATABASE_URL=postgresql://postgres:test-password@quiz-postgres:5432/quiz_royale \
            -e REDIS_URL=redis://quiz-redis:6379 \
            -e JWT_ACCESS_SECRET=ci-access-secret-that-is-at-least-32-characters \
            -e JWT_REFRESH_SECRET=ci-refresh-secret-that-is-at-least-32-characters \
            -e ADMIN_SECRET=ci-admin-secret-that-is-at-least-32-characters \
            -e BUILD_SHA="${DEPLOY_SHA}" \
            "$IMAGE"

          for attempt in {1..75}; do
            if curl --fail --silent --show-error http://127.0.0.1:4000/health/ready; then
              echo
              echo "Backend production readiness check passed."
              exit 0
            fi
            if ! docker inspect -f '{{.State.Running}}' quiz-backend | grep -q true; then
              echo "Backend container exited before becoming ready."
              exit 1
            fi
            sleep 2
          done

          echo "Backend did not become ready within 150 seconds."
          exit 1

  deploy-railway:
    needs: backend-image
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require Railway token
        if: env.HAS_RAILWAY_TOKEN != 'true'
        run: |
          echo "RAILWAY_TOKEN is not configured."
          exit 1

      - name: Set Railway deployment SHA
        run: npm exec --yes --package @railway/cli@5.24.0 -- railway variable set "BUILD_SHA=${DEPLOY_SHA}" --service quiz_royale_showdown
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Railway backend
        run: npm exec --yes --package @railway/cli@5.24.0 -- railway up --service quiz_royale_showdown --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-vercel:
    needs: backend-image
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      HAS_VERCEL_CONFIG: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Require Vercel credentials
        if: env.HAS_VERCEL_CONFIG != 'true'
        run: |
          echo "VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID are required."
          exit 1

      - name: Pull Vercel project config
        run: npm exec --yes --package vercel@58.4.4 -- vercel pull --yes --environment=production --scope adaplus-projects --token "${{ secrets.VERCEL_TOKEN }}"
        working-directory: webapp
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel output for deployment SHA
        run: npm exec --yes --package vercel@58.4.4 -- vercel build --prod --scope adaplus-projects --token "${{ secrets.VERCEL_TOKEN }}"
        working-directory: webapp
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_BUILD_SHA: ${{ env.DEPLOY_SHA }}

      - name: Deploy Vercel output
        run: npm exec --yes --package vercel@58.4.4 -- vercel deploy --prebuilt --prod --scope adaplus-projects --token "${{ secrets.VERCEL_TOKEN }}"
        working-directory: webapp
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  release-gate:
    needs:
      - deploy-railway
      - deploy-vercel
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL }}
      BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL }}
    steps:
      - name: Require production service URLs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FRONTEND_URL}" ] || [ -z "${BACKEND_URL}" ]; then
            echo "PRODUCTION_FRONTEND_URL and PRODUCTION_BACKEND_URL repository variables are required."
            exit 1
          fi

      - name: Verify live frontend and backend SHA synchronization
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_URL="${FRONTEND_URL%/}"
          BACKEND_URL="${BACKEND_URL%/}"

          for attempt in {1..36}; do
            BACKEND_JSON="$(curl --fail --silent --show-error --max-time 10 "${BACKEND_URL}/health" || true)"
            FRONTEND_HTML="$(curl --fail --silent --show-error --max-time 10 "${FRONTEND_URL}/" || true)"

            BACKEND_SHA="$(printf '%s' "$BACKEND_JSON" | python3 -c 'import json,sys
try:
    print(json.load(sys.stdin).get("buildSha", ""))
except Exception:
    print("")')"
            FRONTEND_SHA="$(printf '%s' "$FRONTEND_HTML" | python3 -c 'import re,sys
html=sys.stdin.read()
match=re.search(r"<meta\s+name=[\"\x27]quiz-build-sha[\"\x27]\s+content=[\"\x27]([^\"\x27]+)", html, re.I)
print(match.group(1) if match else "")')"

            echo "Synchronization attempt ${attempt}: frontend=${FRONTEND_SHA:-missing} backend=${BACKEND_SHA:-missing} expected=${DEPLOY_SHA}"

            if [ "$FRONTEND_SHA" = "$DEPLOY_SHA" ] && [ "$BACKEND_SHA" = "$DEPLOY_SHA" ]; then
              echo "Frontend and backend are live on the same release SHA."
              exit 0
            fi

            sleep 5
          done

          echo "Live services did not converge on ${DEPLOY_SHA}."
          exit 1
