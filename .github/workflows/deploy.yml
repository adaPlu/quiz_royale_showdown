name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
      PUBLISH_GHCR_IMAGE: ${{ vars.PUBLISH_GHCR_IMAGE == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare image name
        if: env.PUBLISH_GHCR_IMAGE == 'true'
        run: echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY}/quiz-royale-backend | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build backend image
        if: env.PUBLISH_GHCR_IMAGE == 'true'
        run: docker build -t "${IMAGE_NAME}:${{ github.sha }}" ./backend

      - name: Login to GHCR
        if: env.PUBLISH_GHCR_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        if: env.PUBLISH_GHCR_IMAGE == 'true'
        run: |
          docker push "${IMAGE_NAME}:${{ github.sha }}"
          docker tag "${IMAGE_NAME}:${{ github.sha }}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"

      - name: Trigger Vercel deploy
        if: env.HAS_VERCEL_TOKEN == 'true'
        run: |
          npm exec --yes --package vercel@54.21.1 -- vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
          npm exec --yes --package vercel@54.21.1 -- vercel build --prod --token "${{ secrets.VERCEL_TOKEN }}"
          npm exec --yes --package vercel@54.21.1 -- vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
        working-directory: webapp
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Trigger Railway deploy
        if: env.HAS_RAILWAY_TOKEN == 'true'
        run: npm exec --yes --package @railway/cli@5.24.0 -- railway up --service backend --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
