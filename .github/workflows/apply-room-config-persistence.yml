name: Apply room configuration persistence

on:
  push:
    branches:
      - agent/remediate-audit-findings

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[room-config-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remediate-audit-findings

      - name: Apply exact RoomService changes
        run: python .github/scripts/apply_room_config_persistence.py

      - name: Remove temporary patch machinery
        run: |
          rm .github/scripts/apply_room_config_persistence.py
          rm .github/workflows/apply-room-config-persistence.yml

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist room configuration in RoomService [room-config-patched]"
          git push origin HEAD:agent/remediate-audit-findings
