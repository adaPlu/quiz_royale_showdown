name: Regenerate PR40 backend lock

on:
  push:
    branches:
      - dependabot/npm_and_yarn/npm-minor-and-patch-2aad606bc1

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate standalone backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Verify standalone backend clean install
        working-directory: backend
        run: npm ci --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated backend lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/package-lock.json; then
            echo "backend/package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "Regenerate backend lockfile for grouped npm updates"
          git push origin HEAD:${GITHUB_REF_NAME}
