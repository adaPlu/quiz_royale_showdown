name: Regenerate PR40 backend lock

on:
  push:
    branches:
      - dependabot/npm_and_yarn/npm-minor-and-patch-2aad606bc1

permissions:
  contents: read

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate standalone backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Verify standalone backend clean install
        working-directory: backend
        run: npm ci --workspaces=false --ignore-scripts --no-audit --no-fund

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pr40-backend-package-lock
          path: backend/package-lock.json
          if-no-files-found: error
