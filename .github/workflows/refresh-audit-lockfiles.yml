# Temporary branch-only workflow. Remove after lockfiles are regenerated.
name: Refresh audited lockfiles

on:
  push:
    branches:
      - agent/add-privacy-policy-page

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lockfiles refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-privacy-policy-page

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Regenerate standalone backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --workspaces=false

      - name: Verify clean installs and audits
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high
          (cd backend && npm ci --ignore-scripts --workspaces=false && npm audit --audit-level=high --workspaces=false)

      - name: Commit refreshed lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match package metadata."
            exit 0
          fi
          git commit -m "Regenerate audited dependency lockfiles [lockfiles refreshed]"
          git push origin HEAD:agent/add-privacy-policy-page
