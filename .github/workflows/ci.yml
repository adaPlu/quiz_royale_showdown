name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w backend

      - name: Backend typecheck
        run: npm run typecheck -w backend

      - name: Backend build
        run: npm run build -w backend

      - name: Backend tests
        run: npm run test -w backend

      - name: Web typecheck
        run: npm run typecheck -w webapp

      - name: Web build
        run: npm run build -w webapp

      - name: Web tests
        run: npm run test -w webapp

      # Keep audits blocking, but run them after functional checks so an
      # advisory does not hide type, build, or test failures in the PR.
      - name: Audit workspace dependencies
        run: npm audit --audit-level=high

      - name: Audit backend image dependencies
        run: npm audit --audit-level=high --workspaces=false
        working-directory: backend

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: android

      - name: Android unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: android
