name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit workspace dependencies
        run: npm audit

      - name: Audit backend image dependencies
        run: npm audit --workspaces=false
        working-directory: backend

      - name: Generate Prisma client
        run: npm run prisma:generate -w backend

      - name: Backend typecheck
        run: npm run typecheck -w backend

      - name: Backend build
        run: npm run build -w backend

      - name: Backend tests
        timeout-minutes: 10
        run: npm run test -w backend

      - name: Web typecheck
        run: npm run typecheck -w webapp

      - name: Web tests
        timeout-minutes: 10
        run: npm run test -w webapp

      - name: Web build
        run: npm run build -w webapp

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: adaPlu/quiz_royale_showdown
          ref: ${{ github.ref }}
          path: android-repo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: "gradle"

      - uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x android-repo/android/gradlew

      - name: Android unit tests
        run: cd android-repo/android && ./gradlew testDebugUnitTest
