name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w backend

      - name: Backend typecheck
        run: npm run typecheck -w backend

      - name: Backend build
        run: npm run build -w backend

      - name: Backend tests
        run: npm run test -w backend

      - name: Validate production backend image
        run: docker build -t quiz-royale-backend:pr-${{ github.event.pull_request.number || github.run_number }} ./backend

      - name: Web typecheck
        run: npm run typecheck -w webapp

      - name: Web build
        run: npm run build -w webapp

      - name: Web tests
        run: npm run test -w webapp

      # Keep audits blocking, but run them after functional checks so an
      # advisory does not hide type, build, or test failures in the PR.
      - name: Audit workspace dependencies
        run: npm audit --audit-level=high

      - name: Audit backend image dependencies
        run: npm audit --audit-level=high --workspaces=false
        working-directory: backend

  migration-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-password
          POSTGRES_DB: quiz_royale_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quiz_royale_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:migration-password@127.0.0.1:5432/quiz_royale_migration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w backend

      - name: Rehearse populated upgrade and fresh bootstrap
        run: npm run test:migrations -w backend

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: android

      - name: Android unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: android
