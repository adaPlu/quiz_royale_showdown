name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w backend

      - name: Backend typecheck
        run: npm run typecheck -w backend

      - name: Backend build
        run: npm run build -w backend

      - name: Backend tests
        run: npm run test -w backend

      - name: Validate production backend image
        run: docker build -t quiz-royale-backend:pr-${{ github.event.pull_request.number || github.run_number }} ./backend

      - name: Web typecheck
        run: npm run typecheck -w webapp

      - name: Web build
        run: npm run build -w webapp
        env:
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Web tests
        run: npm run test -w webapp

      - name: Audit workspace dependencies
        run: npm audit --audit-level=high

      - name: Audit backend image dependencies
        run: npm audit --audit-level=high --workspaces=false
        working-directory: backend

  migration-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-password
          POSTGRES_DB: quiz_royale_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quiz_royale_migration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:migration-password@127.0.0.1:5432/quiz_royale_migration
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w backend

      - name: Rehearse populated upgrade and fresh bootstrap
        run: npm run test:migrations -w backend

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: android

      - name: Android unit tests and release build
        run: ./gradlew testDebugUnitTest :app:assembleRelease --no-daemon
        working-directory: android

  codeql-javascript-typescript:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  codeql-java-kotlin:
    name: Analyze Java and Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        working-directory: android

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build Android application
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
