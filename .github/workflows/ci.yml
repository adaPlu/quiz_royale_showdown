name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit workspace dependencies
        run: npm audit --audit-level=high

      - name: Audit backend image dependencies
        run: npm audit --audit-level=high --workspaces=false
        working-directory: backend

      - name: Generate Prisma client
        run: npm run prisma:generate -w backend

      - name: Backend typecheck
        run: npm run typecheck -w backend

      - name: Backend build
        run: npm run build -w backend

      - name: Backend tests
        run: npm run test -w backend

      - name: Web typecheck
        run: npm run typecheck -w webapp

      - name: Web build
        run: npm run build -w webapp
