name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend typecheck
        run: npm run typecheck -w backend

      - name: Backend tests
        timeout-minutes: 10
        run: npm run test -w backend

      - name: Web typecheck
        run: npm run typecheck -w webapp

      - name: Web tests
        timeout-minutes: 10
        run: npm run test -w webapp

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Android source lives in a separate repository (adaPlu/quiz_royale_showdown).
      # We check out the same ref that triggered this workflow so CI always
      # tests the branch under review rather than a hardcoded branch.
      - uses: actions/checkout@v4
        with:
          repository: adaPlu/quiz_royale_showdown
          ref: ${{ github.ref }}
          path: android-repo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Android unit tests
        run: cd android-repo/android && ./gradlew testDebugUnitTest
