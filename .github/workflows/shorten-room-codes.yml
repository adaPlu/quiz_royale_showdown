name: Apply shorter room codes

on:
  push:
    branches:
      - agent/shorter-room-codes
    paths:
      - .github/workflows/shorten-room-codes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/shorter-room-codes
          fetch-depth: 0

      - name: Apply room code changes
        run: python .github/scripts/apply_shorter_room_codes.py

      - name: Remove temporary migration files
        run: |
          git rm .github/workflows/shorten-room-codes.yml
          git rm .github/scripts/apply_shorter_room_codes.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: shorten new room codes to six characters"
          git push origin HEAD:agent/shorter-room-codes
