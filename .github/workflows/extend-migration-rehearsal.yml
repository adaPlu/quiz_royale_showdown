name: Extend migration repair rehearsal

on:
  push:
    branches:
      - agent/repair-railway-migration-history

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[migration-rehearsal-extended]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-railway-migration-history

      - name: Extend the migration rehearsal
        run: python .github/scripts/extend_migration_rehearsal.py

      - name: Remove temporary patch machinery
        run: |
          rm .github/scripts/extend_migration_rehearsal.py
          rm .github/workflows/extend-migration-rehearsal.yml

      - name: Commit the rehearsal changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rehearse partial Railway migration repair [migration-rehearsal-extended]"
          git push origin HEAD:agent/repair-railway-migration-history
