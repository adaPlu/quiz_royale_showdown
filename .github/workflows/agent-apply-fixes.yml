name: Agent Apply Fixes

on:
  push:
    branches:
      - agent/guest-results-and-host-controls

concurrency:
  group: agent-guest-results-and-host-controls
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/guest-results-and-host-controls

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Apply code fixes
        run: |
          python scripts/apply_agent_fixes.py
          python scripts/apply_agent_followup.py
          python scripts/apply_agent_followup2.py
          python scripts/apply_agent_followup3.py
          python scripts/apply_agent_followup4.py

      - name: Repair production dependency lockfiles
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts --workspaces=false --prefix backend

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w backend

      - name: Validate Node applications
        shell: bash
        run: |
          npm run typecheck -w backend
          npm run build -w backend
          npm run test -w backend
          npm run typecheck -w webapp
          npm run build -w webapp
          npm run test -w webapp
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --workspaces=false --prefix backend

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new patch changes to commit."
            exit 0
          fi
          git commit -m "Complete guest gameplay and production hardening"
          git push origin HEAD:agent/guest-results-and-host-controls
