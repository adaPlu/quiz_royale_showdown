name: Agent Apply Fixes

on:
  push:
    branches:
      - agent/guest-results-and-host-controls

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/guest-results-and-host-controls

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Apply code fixes
        run: |
          python scripts/apply_agent_fixes.py
          python scripts/apply_agent_followup.py

      - name: Pin patched transitive dependencies
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("package.json", "backend/package.json"):
              path = Path(name)
              data = json.loads(path.read_text())
              overrides = data.setdefault("overrides", {})
              overrides["socket.io-parser"] = "4.2.7"
              overrides["ip-address"] = "10.4.0"
              path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          npm install --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --workspaces=false --prefix backend

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w backend

      - name: Validate Node applications
        shell: bash
        run: |
          npm run typecheck -w backend
          npm run build -w backend
          npm run test -w backend
          npm run typecheck -w webapp
          npm run build -w webapp
          npm run test -w webapp
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --workspaces=false --prefix backend

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new patch changes to commit."
            exit 0
          fi
          git commit -m "Complete guest gameplay and production hardening"
          git push origin HEAD:agent/guest-results-and-host-controls
